name: apply-media-group-post-fix
on:
  push:
    branches: [main]
    paths:
      - 'ops/apply-media-group-post-fix.txt'
permissions:
  contents: write
concurrency:
  group: apply-media-group-post-fix
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply logical grouped-media post patch
        run: node scripts/apply-media-group-post-fix-v4.mjs
      - name: Reject malformed diff
        run: git diff --check
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build and run all regression tests
        run: npm test
      - name: Commit only verified grouped-media changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/board/route.ts tests/community.test.mjs
          if git diff --cached --quiet; then
            echo 'Logical grouped-media patch already applied.'
            exit 0
          fi
          git commit -m 'Count grouped media as one logical post'
          git pull --rebase origin main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
