name: community-discovery-watchdog

on:
  workflow_dispatch:
  schedule:
    # Check shortly after each collector opportunity. If GitHub drops a cron
    # event, request a bounded repair without running overlapping collectors.
    - cron: '27,57 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: community-discovery-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out current Copy main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'

      - name: Classify snapshot freshness and discovery state
        id: health
        run: node scripts/community-refresh-health.mjs --max-age-minutes 45

      - name: Dispatch one bounded recovery when needed
        if: steps.health.outputs.action == 'collection' || steps.health.outputs.action == 'discovery'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RECOVERY_ACTION: ${{ steps.health.outputs.action }}
        with:
          script: |
            const activeStatuses = new Set([
              "requested", "waiting", "pending", "queued", "in_progress",
            ]);
            const action = process.env.RECOVERY_ACTION;
            const targetWorkflow = action === "collection"
              ? "refresh-pvp-data.yml"
              : "community-discovery-recovery.yml";
            const workflowsToCheck = action === "collection"
              ? ["refresh-pvp-data.yml"]
              : ["refresh-pvp-data.yml", "community-discovery-recovery.yml"];
            for (const workflow_id of workflowsToCheck) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                branch: "main",
                per_page: 20,
              });
              const active = response.data.workflow_runs.some((run) =>
                activeStatuses.has(run.status),
              );
              if (active) {
                core.notice(`A ${workflow_id} run is already queued or active; no duplicate repair was dispatched.`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: targetWorkflow,
              ref: "main",
            });
            core.warning(`The read-only watchdog requested ${targetWorkflow} for ${action} recovery.`);
