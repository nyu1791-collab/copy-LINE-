name: community-feature-tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'worker/**'
      - 'pages-board/**'
      - 'vite.pages.config.mjs'
      - 'config/community-characters.json'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/refresh-pvp-data.yml'
      - '.github/workflows/community-feature-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: community-feature-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Verify resilient PvP runtime patch
        run: |
          set -euo pipefail
          node scripts/prepare-resilient-pvp-runtime.mjs
          node --check scripts/collect-pvp.mjs
          git restore -- scripts/collect-pvp.mjs
      - name: Verify official-source community discovery patch
        run: |
          set -euo pipefail
          node scripts/prepare-community-discovery-runtime.mjs
          node --check scripts/update-community-characters.mjs
          grep -F "const sourcePresent=!!officialIds?.has(id);" scripts/update-community-characters.mjs
          grep -F "const found=await findReleases(Date.parse(updatedAt));" scripts/update-community-characters.mjs
          grep -F "return {rows,pvpComplete};" scripts/update-community-characters.mjs
          git restore -- scripts/update-community-characters.mjs
      - name: Build and run community regression suite
        run: npm test
      - name: Build and verify the GitHub Pages board
        run: |
          set -euo pipefail
          npx vite build --config vite.pages.config.mjs
          node scripts/validate-pages-board.mjs dist-pages/boards
      - name: Lint application and Worker code
        run: npm run lint
