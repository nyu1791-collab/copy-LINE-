name: fix-current-regression-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-current-regression-tests.yml

permissions:
  contents: write

concurrency:
  group: fix-current-regression-tests
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore and align regression contracts
        run: |
          set -euo pipefail
          git checkout d4fb4aedc4dc38219d0940263a8eb276af78fa67 -- tests/community.test.mjs tests/rendered-html.test.mjs
          python - <<'PY'
          from pathlib import Path

          community = Path('tests/community.test.mjs')
          text = community.read_text(encoding='utf-8')
          old = "const r=await activityApi.GET();return {status:r.status,data:await r.json(),headers:r.headers};"
          new = "const r=await activityApi.GET(request);return {status:r.status,data:await r.json(),headers:r.headers};"
          if text.count(old) != 1:
              raise SystemExit('activity test call contract did not match exactly once')
          community.write_text(text.replace(old,new),encoding='utf-8')

          rendered = Path('tests/rendered-html.test.mjs')
          text = rendered.read_text(encoding='utf-8')
          old = "assert.equal(boundedOpenEnded.headers.get('content-range'),`bytes 0-${4*1024*1024-1}/${video.length}`);assert.equal((await boundedOpenEnded.arrayBuffer()).byteLength,4*1024*1024);"
          new = "const explicitRangeBytes=Math.min(video.length,16*1024*1024);assert.equal(boundedOpenEnded.headers.get('content-range'),`bytes 0-${explicitRangeBytes-1}/${video.length}`);assert.equal((await boundedOpenEnded.arrayBuffer()).byteLength,explicitRangeBytes);"
          if text.count(old) != 1:
              raise SystemExit('video range regression contract did not match exactly once')
          rendered.write_text(text.replace(old,new),encoding='utf-8')
          PY
          grep -q 'activityApi.GET(request)' tests/community.test.mjs
          grep -q 'explicitRangeBytes=Math.min(video.length,16\*1024\*1024)' tests/rendered-html.test.mjs
      - name: Install dependencies
        run: npm run install:ci
      - name: Audit and test
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
      - name: Commit repaired tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/community.test.mjs tests/rendered-html.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No repair needed'; exit 0; }
          git commit -m 'Align activity and video range regression contracts'
          git push origin HEAD:main
