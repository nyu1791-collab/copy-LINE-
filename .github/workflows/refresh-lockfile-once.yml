name: refresh-lockfile-once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-lockfile-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Regenerate dependency lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next']?.version!=='16.3.5') process.exit(1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json.'
            exit 0
          fi
          git add package-lock.json
          git commit -m 'Refresh lockfile for Next.js 16.3.5'
          git push origin HEAD:main
