name: refresh-pvp-data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-pvp.mjs'
      - '.github/workflows/refresh-pvp-data.yml'
permissions:
  contents: write
concurrency:
  group: refresh-pvp-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Collect and validate Legend top 200
        run: node scripts/collect-pvp.mjs
      - name: Commit only validated snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pvp/data/character_usage.json public/pvp/data/character_usage_history.json
          if git diff --cached --quiet; then
            echo 'No PvP snapshot change.'
            exit 0
          fi
          git commit -m 'Refresh validated PvP snapshot'
          git push
