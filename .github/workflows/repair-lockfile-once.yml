name: repair-lockfile-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lockfile-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Canonicalize imported lockfile
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/repair-package-lock.sh
          node -e "JSON.parse(require('node:fs').readFileSync('package-lock.json','utf8'))"
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json was already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Canonicalize package lockfile'
          git push origin HEAD:main
