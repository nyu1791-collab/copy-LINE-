name: strengthen-display-name-persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strengthen-display-name-persistence.yml'
      - '.github/scripts/strengthen_display_name.py'

permissions:
  contents: write

concurrency:
  group: strengthen-display-name-persistence
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply guarded persistence patch
        run: python .github/scripts/strengthen_display_name.py

      - name: Install, audit, test, lint and build
        run: |
          set -euo pipefail
          npm run install:ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run build

      - name: Commit only validated persistence changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/community.tsx app/api/board/route.ts lib/anonymous-session.ts lib/upload-session.ts tests/display-name-persistence.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No persistence changes to commit.'; exit 0; }
          git commit -m 'Strengthen returning display-name persistence'
          git pull --rebase origin main
          git push origin HEAD:main
