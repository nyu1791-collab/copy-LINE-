name: strengthen-display-name-persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strengthen-display-name-persistence.yml'

permissions:
  contents: write

concurrency:
  group: strengthen-display-name-persistence
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply guarded persistence patch
        run: |
          python - <<'PY'
          from pathlib import Path

          session_path = Path('lib/anonymous-session.ts')
          session = session_path.read_text(encoding='utf-8')
          old_session = "if(existing){const sub=await verify(existing);if(sub)return {sub,anonymous:true,displayName:savedDisplayName};}"
          new_session = "if(existing){const sub=await verify(existing);if(sub)return {sub,anonymous:true,displayName:savedDisplayName,setCookie:await guestCookie(sub),setCookies:savedDisplayName?[displayNameCookie(savedDisplayName)]:[]};}"
          if old_session not in session:
              raise SystemExit('anonymous-session guest restore contract changed; refusing blind patch')
          session = session.replace(old_session, new_session, 1)
          session_path.write_text(session, encoding='utf-8')

          community_path = Path('app/community.tsx')
          community = community_path.read_text(encoding='utf-8')
          anchor = " useEffect(()=>{if(!boardPage)return;const controller=new AbortController();const timer=window.setTimeout(()=>void reload(controller.signal),0);return()=>{clearTimeout(timer);controller.abort();};},[reload,boardPage]);\n"
          if anchor not in community:
              raise SystemExit('community reload effect changed; refusing blind patch')
          restore_effect = """ // If Safari/user cleanup removes the signed guest/display cookies but localStorage\n // survives, re-bind the saved display name to the newly minted anonymous\n // subject. A display name is never an authorization credential; the server\n // still owns identity, roles, validation, and the HttpOnly cookies.\n useEffect(()=>{\n  if(!boardPage||!data||data.me||!data.anonymous||profileRestoreInFlight.current)return;\n  let savedDisplay='';try{savedDisplay=localStorage.getItem(displayNameStorageKey)||'';}catch{}\n  savedDisplay=savedDisplay.trim();if(!savedDisplay)return;\n  const restoreKey='local-storage-bootstrap';if(profileRestoreSubject.current===restoreKey)return;\n  profileRestoreInFlight.current=restoreKey;\n  void rawBoardRequest<{error?:string;me?:Data['me']}>({action:'profile',name:savedDisplay}).then(result=>{\n   if(!result.me)return;profileRestoreSubject.current=restoreKey;persistDisplayName(result.me.name);setName(result.me.name);setData(current=>current?{...current,me:result.me!}:current);\n  }).catch(()=>{}).finally(()=>{if(profileRestoreInFlight.current===restoreKey)profileRestoreInFlight.current='';});\n },[boardPage,data]);\n"""
          community = community.replace(anchor, anchor + restore_effect, 1)
          community_path.write_text(community, encoding='utf-8')

          test_path = Path('tests/display-name-persistence.test.mjs')
          test_path.write_text(r'''import assert from 'node:assert/strict';
import test from 'node:test';
import {readFileSync} from 'node:fs';
import ts from 'typescript';

const root=new URL('../',import.meta.url);
const communitySource=readFileSync(new URL('app/community.tsx',root),'utf8');
const sessionSource=readFileSync(new URL('lib/anonymous-session.ts',root),'utf8');

function compile(path,require){
 const source=readFileSync(new URL(path,root),'utf8');
 const code=ts.transpileModule(source,{compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2022}}).outputText;
 const exports={};new Function('exports','require',code)(exports,require);return exports;
}

const anonymous=compile('lib/anonymous-session.ts',id=>{
 if(id==='cloudflare:workers')return {env:{BOARD_ANON_COOKIE_SECRET:'test-anon-cookie-secret-0123456789012345',BOARD_OWNER_SUBJECT:'owner-subject',BOARD_OWNER_ACCESS_TOKEN:'owner-access'}};
 if(id==='@/lib/rules')return {ownerDisplayName:'LINEレンジャーは神ゲー'};
 throw new Error('Unexpected import '+id);
});

function cookiePair(setCookie){return String(setCookie||'').split(';',1)[0];}

test('returning anonymous sessions renew the signed guest cookie',async()=>{
 const first=await anonymous.sessionFromHeaders(new Headers());
 assert.equal(first.anonymous,true);
 assert.match(first.setCookie||'',/^__Host-lr_guest=v1\./);
 assert.match(first.setCookie||'',/Max-Age=31536000/);
 assert.match(first.setCookie||'',/Secure/);
 assert.match(first.setCookie||'',/HttpOnly/);
 const returning=await anonymous.sessionFromHeaders(new Headers({cookie:cookiePair(first.setCookie)}));
 assert.equal(returning.sub,first.sub);
 assert.equal(returning.anonymous,true);
 assert.match(returning.setCookie||'',/^__Host-lr_guest=v1\./);
 assert.match(returning.setCookie||'',/Max-Age=31536000/);
});

test('returning display name refreshes its server-only fallback cookie',async()=>{
 const first=await anonymous.sessionFromHeaders(new Headers());
 const guest=cookiePair(first.setCookie);
 const display=cookiePair(anonymous.displayNameCookie('保存ユーザー'));
 const returning=await anonymous.sessionFromHeaders(new Headers({cookie:`${guest}; ${display}`}));
 assert.equal(returning.displayName,'保存ユーザー');
 assert.ok(returning.setCookies?.some(value=>value.includes('__Host-lr_display_name=')));
 assert.ok(returning.setCookies?.every(value=>value.includes('HttpOnly')));
});

test('client can rebind a saved local display name after only cookies are cleared',()=>{
 assert.match(communitySource,/local-storage-bootstrap/);
 assert.match(communitySource,/!boardPage\|\|!data\|\|data\.me\|\|!data\.anonymous/);
 assert.match(communitySource,/localStorage\.getItem\(displayNameStorageKey\)/);
 assert.match(communitySource,/rawBoardRequest<\{error\?:string;me\?:Data\['me'\]\}>\(\{action:'profile',name:savedDisplay\}\)/);
 assert.match(communitySource,/persistDisplayName\(result\.me\.name\)/);
});

test('display names remain non-authoritative and server cookies stay protected',()=>{
 assert.match(sessionSource,/Display names are not credentials/);
 assert.match(sessionSource,/__Host-lr_display_name/);
 assert.match(sessionSource,/SameSite=Lax; Secure; HttpOnly/);
 assert.doesNotMatch(sessionSource,/displayName.*role.*owner/i);
});
''',encoding='utf-8')
          PY

      - name: Install, audit, test, lint and build
        run: |
          set -euo pipefail
          npm run install:ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run build

      - name: Commit only validated persistence changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/community.tsx lib/anonymous-session.ts tests/display-name-persistence.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No persistence changes to commit.'; exit 0; }
          git commit -m 'Strengthen returning display-name persistence'
          git pull --rebase origin main
          git push origin HEAD:main
