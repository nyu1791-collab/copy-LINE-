name: visual-review-closed

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["deploy-cloudflare-review"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://line-rangers-pvp-community-review.n-yu1791.workers.dev
    steps:
      - name: Verify no public visual surface is available
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 -o /tmp/closed-visual-body -w '%{http_code}' "$BASE/")"
          test "$status" = "404"
          test ! -s /tmp/closed-visual-body
          echo "No public visual surface is available."
