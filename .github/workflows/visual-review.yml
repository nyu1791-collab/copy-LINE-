name: visual-review
on:
  push:
    branches: [main]
    paths:
      - 'public/pvp/**'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_URL: https://line-rangers-pvp-community-review.n-yu1791.workers.dev/pvp/index.html
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for visual review
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture mobile and tablet review screenshots
        run: |
          set -euo pipefail
          mkdir -p visual-review
          npx -y playwright@1.55.0 screenshot --browser=chromium --device='iPhone 13' --full-page --wait-for-timeout=5000 "$REVIEW_URL" visual-review/pvp-mobile.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size='1024,1366' --full-page --wait-for-timeout=5000 "$REVIEW_URL" visual-review/pvp-tablet.png
          test -s visual-review/pvp-mobile.png
          test -s visual-review/pvp-tablet.png
      - name: Verify live PvP and board entry contract
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$REVIEW_URL")"
          grep -q 'UNOFFICIAL STATISTICS' <<< "$html"
          grep -q 'レジェンド帯 キャラ集計' <<< "$html"
          grep -q 'href="/boards"' <<< "$html"
          grep -q 'かに座 サリー' <<< "$html"
          grep -q '究極進化' <<< "$html"
          grep -q 'original-compat.css' <<< "$html"
      - uses: actions/upload-artifact@v4
        with:
          name: pvp-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 7
