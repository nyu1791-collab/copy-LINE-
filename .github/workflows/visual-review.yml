name: visual-review

# The live Worker is a public surface, so visual review is manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_URL: https://line-rangers-pvp-community-review.n-yu1791.workers.dev/pvp/index.html
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for visual review
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture mobile and tablet review screenshots
        run: |
          set -euo pipefail
          mkdir -p visual-review
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size='390,844' --full-page --wait-for-timeout=5000 "$REVIEW_URL" visual-review/pvp-mobile.png
          npx -y playwright@1.55.0 screenshot --browser=chromium --viewport-size='1024,1366' --full-page --wait-for-timeout=5000 "$REVIEW_URL" visual-review/pvp-tablet.png
          test -s visual-review/pvp-mobile.png
          test -s visual-review/pvp-tablet.png
      - name: Verify live PvP and board contract
        run: |
          set -euo pipefail
          pvp="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$REVIEW_URL")"
          board="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${REVIEW_URL%/pvp/index.html}/boards")"
          grep -q 'UNOFFICIAL STATISTICS' <<< "$pvp"
          grep -q 'レジェンド帯 キャラ集計' <<< "$pvp"
          grep -q '新キャラ情報掲示板' <<< "$board"
      - uses: actions/upload-artifact@v4
        with:
          name: pvp-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 7
