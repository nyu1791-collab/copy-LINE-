name: visual-review-closed

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["deploy-cloudflare-review"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://line-rangers-pvp-community-review.n-yu1791.workers.dev
    steps:
      - name: Verify no public visual surface is available
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 8 --retry-delay 2 -D /tmp/closed-headers -o /tmp/closed-body -w '%{http_code}' "$BASE/api/health")"
          test "$status" = "404"
          if grep -Eq '新キャラ情報掲示板|レジェンド帯 キャラ集計' /tmp/closed-body; then
            exit 1
          fi
          echo "No public visual surface is available."
